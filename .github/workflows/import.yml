name: Import website package
on:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download import-1 --pattern 'statenisland.zip'
      - name: Verify checksum
        run: echo "ea8429528bc3098fbcdf7b10c0669bc528ecd802586cc2e66cda7eebbde272f2  statenisland.zip" | sha256sum -c -
      - name: Replace contents
        run: |
          mkdir -p /tmp/pkg && unzip -o statenisland.zip -d /tmp/pkg
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/pkg/. .
          rm -rf .github statenisland.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website package"
          git push
